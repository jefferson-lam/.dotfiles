set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

# --- Integrated look: status bar/borders blend into terminal background ---
# Rose Pine Moon palette
set -g status-style "bg=default,fg=#e0def4"
set -g pane-border-style "fg=default"
set -g pane-active-border-style "fg=#9ccfd8"
set -g window-status-style "fg=#908caa,bg=default"
set -g window-status-current-style "fg=#232136,bg=#c4a7e7,bold"
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g status-left ""
set -g status-right "#[fg=#908caa]%H:%M "

unbind C-b
set -g prefix C-Space
bind Space send-prefix

bind j split-window -v
bind C-j split-window -v

bind l split-window -h
bind C-l split-window -h

set -g mouse on
# sane scrolling:
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e; send-keys -M'"

run '~/.tmux/plugins/tpm/tpm'

